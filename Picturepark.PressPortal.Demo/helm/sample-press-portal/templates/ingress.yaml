apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sample-press-portal.fullname" . }}
spec:
  ingressClassName: "{{ .Values.ingress.class }}"
  rules:
    - host: "{{ .Values.ingress.host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sample-press-portal.fullname" . }}
                port:
                  number: 5000
